---
- name: Provision DevOps tools on webtext-app VM
  hosts: devops_vm
  become: true
  gather_facts: true

  vars:
    task_version: "3.35.1"
    doppler_apt_key_url: "https://packages.doppler.com/public/cli/gpg.DE57EDBF.gpg"

  tasks:

    # ── System update ──────────────────────────────────────────────────────────

    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
        state: present

    # ── Docker ────────────────────────────────────────────────────────────────

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ── Doppler CLI ───────────────────────────────────────────────────────────

    - name: Add Doppler GPG key
      ansible.builtin.shell: |
        curl -sLf {{ doppler_apt_key_url }} | gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/doppler-archive-keyring.gpg

    - name: Add Doppler apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/doppler-cli.list
        content: "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] https://packages.doppler.com/public/cli/deb/debian any-version main\n"
        mode: "0644"

    - name: Install Doppler CLI
      ansible.builtin.apt:
        name: doppler
        state: present
        update_cache: true

    # ── Task (go-task) ────────────────────────────────────────────────────────

    - name: Download and install Task binary
      ansible.builtin.shell: |
        sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v{{ task_version }}
      args:
        creates: /usr/local/bin/task

    # ── Verification ──────────────────────────────────────────────────────────

    - name: Print installed tool versions
      ansible.builtin.shell: |
        echo "Docker:  $(docker --version)"
        echo "Doppler: $(doppler --version)"
        echo "Task:    $(task --version)"
      register: versions
      changed_when: false

    - name: Show versions
      ansible.builtin.debug:
        msg: "{{ versions.stdout_lines }}"
