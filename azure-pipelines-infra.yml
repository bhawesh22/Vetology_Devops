```yaml
variables:
  - name: ANSIBLE_WORKING_DIR
    value: ansible

stages:

# =========================================================
# TERRAFORM STAGE
# =========================================================

- stage: Terraform
  displayName: 'Terraform Deployment'

  jobs:
  - job: Terraform
    displayName: 'Terraform Init, Plan & Apply'

    pool:
      name: Default

    steps:

    - checkout: self

    # -----------------------------------------------------
    # Install Terraform
    # -----------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/Dev'
        backendServiceArm: 'vetologysc'
        backendAzureRmResourceGroupName: 'rg-vetology-tfstate'
        backendAzureRmStorageAccountName: 'stvetologytfstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'vetology.terraform.tfstate'

    # -----------------------------------------------------
    # Terraform Plan
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/Dev'
        environmentServiceNameAzureRM: 'vetologysc'

    # -----------------------------------------------------
    # Terraform Apply
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/Dev'
        environmentServiceNameAzureRM: 'vetologysc'
        commandOptions: '-auto-approve'

    # -----------------------------------------------------
    # Get VM Public IP
    # -----------------------------------------------------

    - bash: |
        set -e

        cd "$(System.DefaultWorkingDirectory)/terraform/Dev"

        VM_PUBLIC_IP=$(terraform output -raw vm_public_ip)

        if [ -z "$VM_PUBLIC_IP" ]; then
          echo "ERROR: Terraform VM public IP is empty"
          exit 1
        fi

        echo "======================================"
        echo "VM Public IP: $VM_PUBLIC_IP"
        echo "======================================"

        echo "##vso[task.setvariable variable=VM_PUBLIC_IP;isOutput=true]$VM_PUBLIC_IP"

      name: TerraformOutput
      displayName: 'Get VM Public IP'


# =========================================================
# ANSIBLE STAGE
# =========================================================

- stage: Ansible
  displayName: 'Ansible Configuration'

  dependsOn: Terraform
  condition: succeeded()

  variables:
    VM_PUBLIC_IP: $[ stageDependencies.Terraform.Terraform.outputs['TerraformOutput.VM_PUBLIC_IP'] ]

  jobs:
  - job: ConfigureVM
    displayName: 'Configure VM using Ansible'

    pool:
      name: Default

    steps:

    - checkout: self

    # -----------------------------------------------------
    # Show Terraform IP
    # -----------------------------------------------------

    - bash: |
        set -e

        echo "======================================"
        echo "Terraform VM Public IP:"
        echo "$(VM_PUBLIC_IP)"
        echo "======================================"

      displayName: 'Show VM Public IP'


    # -----------------------------------------------------
    # Check Linux Environment
    # -----------------------------------------------------

    - bash: |
        set -e

        echo "Operating System:"
        uname -a

        echo "Current User:"
        whoami

        echo "HOME:"
        echo "$HOME"

      displayName: 'Check Linux Agent'


    # -----------------------------------------------------
    # Check Ansible
    # -----------------------------------------------------

    - bash: |
        set -e

        echo "Checking Ansible installation..."

        ansible --version

      displayName: 'Check Ansible Installation'


    # -----------------------------------------------------
    # Check SSH Key
    # -----------------------------------------------------

    - bash: |
        set -e

        SSH_KEY="$HOME/.ssh/id_rsa"

        echo "Checking SSH key:"
        echo "$SSH_KEY"

        if [ ! -f "$SSH_KEY" ]; then
          echo "ERROR: SSH private key not found:"
          echo "$SSH_KEY"
          exit 1
        fi

        chmod 600 "$SSH_KEY"

        echo "SSH private key found."

      displayName: 'Check SSH Private Key'


    # -----------------------------------------------------
    # Generate Dynamic Ansible Inventory
    # -----------------------------------------------------

    - bash: |
        set -e

        ANSIBLE_DIR="$(System.DefaultWorkingDirectory)/$(ANSIBLE_WORKING_DIR)"
        INVENTORY_FILE="$ANSIBLE_DIR/inventory.ini"
        SSH_KEY="$HOME/.ssh/id_rsa"

        mkdir -p "$ANSIBLE_DIR"

        cat > "$INVENTORY_FILE" <<EOF
[devops_vm]
$(VM_PUBLIC_IP) ansible_user=devops ansible_ssh_private_key_file=$SSH_KEY
EOF

        echo "======================================"
        echo "Generated Ansible Inventory:"
        echo "======================================"

        cat "$INVENTORY_FILE"

      displayName: 'Generate Ansible Inventory'


    # -----------------------------------------------------
    # Test Ansible SSH Connection
    # -----------------------------------------------------

    - bash: |
        set -e

        INVENTORY_FILE="$(System.DefaultWorkingDirectory)/$(ANSIBLE_WORKING_DIR)/inventory.ini"

        echo "Testing Ansible connection..."

        ansible -i "$INVENTORY_FILE" devops_vm -m ping

      displayName: 'Test Ansible Connection'


    # -----------------------------------------------------
    # Run Ansible Playbook
    # -----------------------------------------------------

    - bash: |
        set -e

        INVENTORY_FILE="$(System.DefaultWorkingDirectory)/$(ANSIBLE_WORKING_DIR)/inventory.ini"
        PLAYBOOK_FILE="$(System.DefaultWorkingDirectory)/$(ANSIBLE_WORKING_DIR)/playbook.yml"

        echo "======================================"
        echo "Running Ansible Playbook"
        echo "======================================"

        ansible-playbook \
          -i "$INVENTORY_FILE" \
          "$PLAYBOOK_FILE"

      displayName: 'Run Ansible Playbook'
```
