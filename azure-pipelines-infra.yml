trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - ansible/**

pool:
  name: Default

variables:
  - group: vetology-infra-secrets

  - name: TF_WORKING_DIR
    value: terraform

  - name: ANSIBLE_WORKING_DIR
    value: ansible

stages:

  - stage: Terraform
    displayName: "Provision Infrastructure - Terraform"

    jobs:
      - job: TerraformPlan
        displayName: "Terraform Init Plan Apply"

        steps:

          - powershell: |
              Write-Host "=========================================="
              Write-Host "REPOSITORY ROOT"
              Write-Host "=========================================="

              Get-ChildItem "$(Build.SourcesDirectory)"

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "TERRAFORM DIRECTORY"
              Write-Host "=========================================="

              if (Test-Path "$(Build.SourcesDirectory)\terraform") {
                  Get-ChildItem "$(Build.SourcesDirectory)\terraform"
              }
              else {
                  Write-Error "terraform folder NOT FOUND"
              }

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "ALL TERRAFORM FILES"
              Write-Host "=========================================="

              Get-ChildItem "$(Build.SourcesDirectory)" -Filter "*.tf" -Recurse

            displayName: "Check Terraform Files"


          - task: TerraformInstaller@1
            displayName: "Install Terraform"

            inputs:
              terraformVersion: "1.7.5"


          - task: TerraformTaskV4@4
            displayName: "Terraform Init"

            inputs:
              provider: azurerm
              command: init
              workingDirectory: "$(TF_WORKING_DIR)"
              backendServiceArm: "vetologysc"
              backendAzureRmResourceGroupName: "rg-vetology-tfstate"
              backendAzureRmStorageAccountName: "stvetologytfstate"
              backendAzureRmContainerName: "tfstate"
              backendAzureRmKey: "vetology.terraform.tfstate"


          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"

            inputs:
              provider: azurerm
              command: plan
              workingDirectory: "$(TF_WORKING_DIR)"
              environmentServiceNameAzureRM: "vetologysc"


          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"

            inputs:
              provider: azurerm
              command: apply
              workingDirectory: "$(TF_WORKING_DIR)"
              commandOptions: "-auto-approve"
              environmentServiceNameAzureRM: "vetologysc"


          - powershell: |
              $terraformDir = "$(Build.SourcesDirectory)\$(TF_WORKING_DIR)"

              Write-Host "Terraform directory:"
              Write-Host $terraformDir

              Set-Location $terraformDir

              $VM_IP = terraform output -raw vm_public_ip

              Write-Host "VM Public IP: $VM_IP"

              Write-Host "##vso[task.setvariable variable=VM_IP;isOutput=true]$VM_IP"

            name: GetVMIP
            displayName: "Export VM Public IP"


  - stage: Ansible
    displayName: "Install Tools on VM - Ansible"

    dependsOn: Terraform

    variables:
      VM_IP: $[ stageDependencies.Terraform.TerraformPlan.outputs['GetVMIP.VM_IP'] ]

    jobs:
      - job: AnsibleProvision
        displayName: "Run Ansible Playbook"

        steps:

          - powershell: |
              Write-Host "VM IP received from Terraform:"
              Write-Host "$(VM_IP)"

            displayName: "Check VM IP"

